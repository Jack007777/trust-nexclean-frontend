<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trust Customers</title>
    <link rel="stylesheet" href="./styles.css?v=20260217o" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Trust Customers</div>
      <div id="userBox" class="user-box hidden">
        <span id="userLabel"></span>
        <button id="logoutBtn" class="secondary">退出</button>
      </div>
    </header>

    <main>
      <section id="loginPanel" class="card login-card">
        <h2>团队登录</h2>
        <div class="form-row">
          <label>用户名</label>
          <input id="loginUser" value="admin" />
        </div>
        <div class="form-row">
          <label>密码</label>
          <input id="loginPass" type="password" value="admin123" />
        </div>
        <button id="loginBtn">登录</button>
      </section>

      <section id="appPanel" class="hidden">
        <section class="search-strip card">
          <div class="search-main">
            <input id="searchInput" class="search-keyword" placeholder="搜索公司/联系人/邮箱/业务描述/备注" />
            <select id="countrySelect" class="search-country">
              <option value="">全部国家</option>
            </select>
            <input id="nearInput" class="search-near" list="cityHints" placeholder="位置（城市/邮编）" />
            <datalist id="cityHints"></datalist>
            <select id="radiusKmSelect" class="search-radius">
              <option value="10">+ 10 km</option>
              <option value="20" selected>+ 20 km</option>
              <option value="50">+ 50 km</option>
              <option value="100">+ 100 km</option>
              <option value="200">+ 200 km</option>
              <option value="300">+ 300 km</option>
              <option value="500">+ 500 km</option>
            </select>
            <button id="searchBtn" class="find-btn">搜索</button>
          </div>
          <div class="search-actions">
            <label class="checkline"><input id="includeTrustDirectInput" type="checkbox" /> 包含Trust 直接客户</label>
            <button id="resetBtn" class="secondary">重置</button>
            <button id="addBtn" class="accent">新增客户</button>
          </div>
        </section>

        <section class="card meta">
          <span id="stats"></span>
        </section>

        <section class="card table-wrap">
          <table id="customersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>公司</th>
                <th>联系人</th>
                <th>电话</th>
                <th>邮箱</th>
                <th>国家</th>
                <th>城市</th>
                <th>邮编</th>
                <th>匹配度</th>
                <th>Trust直接客户</th>
                <th>业务描述</th>
                <th>备注</th>
                <th>获客渠道</th>
                <th>来源文件</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="pager">
          <button id="prevBtn" class="secondary">上一页</button>
          <span id="pageInfo"></span>
          <button id="nextBtn" class="secondary">下一页</button>
        </section>
      </section>
    </main>

    <dialog id="editorDialog">
      <form id="editorForm" method="dialog">
        <h3 id="dialogTitle">编辑客户</h3>
        <div class="grid">
          <label>公司<input name="company_name" required /></label>
          <label>联系人<input name="contact_name" /></label>
          <label>电话<input name="phone" /></label>
          <label>网址<input name="website" /></label>
          <label>邮箱<input name="email" /></label>
          <label>获客渠道<input name="lead_source" /></label>
          <label class="full">业务描述<input name="business_description" /></label>
          <label>国家<input name="country" /></label>
          <label>街道<input name="street" /></label>
          <label>城市<input name="city" /></label>
          <label>邮编<input name="postcode" /></label>
          <label>匹配度
            <select name="match_score">
              <option value="">未设置</option>
              <option value="0">0星</option>
              <option value="1">1星</option>
              <option value="2">2星</option>
              <option value="3">3星</option>
              <option value="4">4星</option>
              <option value="5">5星</option>
            </select>
          </label>
          <label><input name="trust_direct_customer" type="checkbox" /> Trust直接客户</label>
          <label class="full">地点<input name="location" /></label>
          <label>来源文件<input name="source_file" /></label>
          <label>工作表<input name="sheet_name" /></label>
          <label>源行号<input name="source_row" type="number" min="0" /></label>
          <label class="full">备注<textarea name="note" rows="3"></textarea></label>

          <input type="hidden" name="latitude" />
          <input type="hidden" name="longitude" />
        </div>
        <menu>
          <button value="cancel" class="secondary">取消</button>
          <button id="saveBtn" value="default">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="commDialog">
      <form id="commForm" method="dialog">
        <h3 id="commTitle">客户沟通记录</h3>
        <div class="grid">
          <label>渠道<input id="commChannel" placeholder="email / phone / meeting" /></label>
          <label>联系人<input id="commContact" placeholder="name" /></label>
          <label class="full">主题<input id="commSubject" placeholder="subject" /></label>
          <label class="full">内容<textarea id="commContent" rows="4" placeholder="communication details"></textarea></label>
          <label>沟通时间<input id="commHappenedAt" placeholder="2026-02-17T10:30:00" /></label>
          <label>下次跟进<input id="commFollowUpAt" placeholder="2026-02-25T09:00:00" /></label>
        </div>
        <menu>
          <button id="commCloseBtn" type="button" class="secondary">关闭</button>
          <button id="commSaveBtn" value="default">新增记录</button>
        </menu>
      </form>
      <section id="commList" class="comm-list"></section>
    </dialog>

    <script src="./config.js?v=20260217f"></script>
    <script src="./app.js?v=20260217o"></script>
  </body>
</html>
